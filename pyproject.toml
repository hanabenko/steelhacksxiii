[project]
name = "interlock-data-pipeline"
version = "0.1.0"
description = "Data ingestion and intersection selection for Interlock"
requires-python = ">=3.12,<3.15"
dependencies = [
    "geopandas>=1.1.1",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

